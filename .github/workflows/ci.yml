name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # intelbit-bitrix24-client и floweon-sdk ставятся из публичных git-тегов —
      # соседние репозитории и приватный монорепо не нужны.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python-version }}

      # --locked: CI ставит строго по uv.lock; рассинхрон с pyproject.toml — сразу ошибка (4-17-36).
      - name: Sync
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest
